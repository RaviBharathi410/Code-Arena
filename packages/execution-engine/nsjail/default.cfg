# NsJail Configuration file for CodeArena Execution Engine
# Enforces isolation using Linux namespaces, cgroups v2, seccomp, and resource limits

name: "codearena-nsjail"
description: "NsJail configuration for untrusted competitive coding executions"

mode: ONCE
hostname: "codearena-sandbox"

# Security Enforcements
clone_newnet: true       # Drop all network access (no network namespace egress)
clone_newuser: true      # New user namespace
clone_newns: true        # New mount namespace
clone_newpid: true       # New PID namespace
clone_newipc: true       # New IPC namespace
clone_newuts: true       # New UTS (hostname) namespace
clone_newcgroup: true    # New cgroup namespace

# User mapping (non-root inside sandbox)
uidmap {
    inside_id: "65534"
    outside_id: "100000"
    count: 1
}

gidmap {
    inside_id: "65534"
    outside_id: "100000"
    count: 1
}

# Resource limits (cgroups & rlimits)
time_limit: 3            # Wall time limit (seconds)
rlimit_cpu: 2            # CPU time limit (seconds)
rlimit_as: 268435456     # Address Space / Memory limit (256 MB)
rlimit_nproc: 64         # Max PIDs/threads per job
rlimit_fsize: 10         # Max created file size (10 MB)
rlimit_nofile: 64        # Max open file descriptors

# Read-only standard filesystem mounts
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: false
    mandatory: false
}

# Default seccomp policy string (drops dangerous syscalls: socket, ptrace, execveat, etc.)
seccomp_string: "KILL_PROCESS { socket, connect, ptrace, process_vm_writev, reboot, kexec_load, init_module, delete_module }"
